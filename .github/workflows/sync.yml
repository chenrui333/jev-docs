name: Synchronize TypeSafe evidence

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

concurrency:
  group: jev-docs-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --dev --python 3.12
      - run: PYTHONPATH=src uv run python -m jev_docs sync --strict
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: PYTHONPATH=src uv run python -m jev_docs validate --strict
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BEST_PRACTICES.md sources state events changes
          git diff --cached --quiet && exit 0
          git commit -s -m "chore(sync): update TypeSafe evidence"
          # A normal push rejects the update if main advanced after checkout.
          git push origin HEAD:main
