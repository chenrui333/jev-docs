name: Synchronize TypeSafe evidence

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

concurrency:
  group: jev-docs-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev --python 3.12
      - id: observe
        run: PYTHONPATH=src uv run python -m jev_docs sync --strict --diagnostics "$RUNNER_TEMP/sync-attempt.json"
      - id: lint
        run: uv run ruff check .
      - id: format
        run: uv run ruff format --check .
      - id: tests
        run: uv run pytest
      - id: compile
        run: uv run python -m compileall -q src tests
      - id: validate
        run: PYTHONPATH=src uv run python -m jev_docs validate --strict
      - name: Commit generated changes
        id: commit
        run: |
          git add BEST_PRACTICES.md MODEL_LIMITATIONS.md sources state events changes
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -s -m "chore(sync): update TypeSafe evidence"
          # A normal push rejects the update if main advanced after checkout.
          git push origin HEAD:main
      - name: Describe failed attempt
        if: failure()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: python .github/scripts/sync_diagnostics.py "$RUNNER_TEMP/sync-attempt.json"
      - name: Upload failed attempt
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-failed-attempt
          path: ${{ runner.temp }}/sync-attempt.json
          retention-days: 14
          if-no-files-found: warn
