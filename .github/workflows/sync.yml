name: Synchronize TypeSafe evidence

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

concurrency:
  group: jev-docs-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      baseline: ${{ steps.bundle.outputs.baseline }}
      publication_eligible: ${{ steps.bundle.outputs.publication_eligible }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      health_failure: ${{ steps.bundle.outputs.health_failure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev --python 3.12
      - id: observe
        name: Observe public evidence without API keys
        run: |
          status=0
          PYTHONPATH=src uv run python -m jev_docs sync --strict --diagnostics "$RUNNER_TEMP/sync-attempt.json" || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
      - id: lint
        run: uv run ruff check .
      - id: format
        run: uv run ruff format --check .
      - id: tests
        run: uv run pytest
      - id: compile
        run: uv run python -m compileall -q src tests
      - id: validate
        run: PYTHONPATH=src uv run python -m jev_docs validate --strict
      - name: Prepare bounded generated patch
        id: bundle
        env:
          BASELINE: ${{ github.sha }}
          SYNC_EXIT: ${{ steps.observe.outputs.exit_code }}
        run: |
          python .github/scripts/sync_publication.py prepare \
            --repo "$GITHUB_WORKSPACE" --artifact "$RUNNER_TEMP/sync-publication" \
            --diagnostics "$RUNNER_TEMP/sync-attempt.json" --sync-exit "$SYNC_EXIT" \
            --baseline "$BASELINE" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload generated publication data
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sync-publication/generated.patch
            ${{ runner.temp }}/sync-publication/manifest.json
          retention-days: 1
          if-no-files-found: error
      - name: Preserve strict synchronization failure
        id: strict_health
        if: always() && steps.observe.outputs.exit_code != '' && steps.observe.outputs.exit_code != '0'
        run: |
          echo 'Strict synchronization failed; eligible independent changes may still publish.' >&2
          exit 1
      - name: Describe failed attempt
        if: failure()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: python .github/scripts/sync_diagnostics.py "$RUNNER_TEMP/sync-attempt.json"
      - name: Upload failed attempt
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-failed-attempt
          path: ${{ runner.temp }}/sync-attempt.json
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: sync
    if: always() && !cancelled() && needs.sync.outputs.publication_eligible == 'true' && needs.sync.outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out trusted scripts at the intended baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only the artifact emitted by this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.sync.outputs.artifact_id }}
          path: ${{ runner.temp }}/sync-publication
          merge-multiple: true
      - name: Validate provenance and apply generated-only patch
        env:
          BASELINE: ${{ needs.sync.outputs.baseline }}
          EXPECTED_BASELINE: ${{ github.sha }}
        run: |
          test "$BASELINE" = "$EXPECTED_BASELINE"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python .github/scripts/sync_publication.py apply \
            --repo "$GITHUB_WORKSPACE" --artifact "$RUNNER_TEMP/sync-publication" \
            --baseline "$EXPECTED_BASELINE" --require-origin-main \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Validate generated tree using trusted code
        run: PYTHONPATH=src python -m jev_docs validate --strict
      - name: Commit and push generated data without executing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -s -m "chore(sync): update TypeSafe evidence"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          # No persisted credentials, force pushes, or execution of ingested files.
          # A concurrent update after validation is rejected by this normal push.
          git -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main

  strict-health:
    needs: [sync, publish]
    if: always() && needs.sync.outputs.health_failure == 'true'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Report expired SDK health after publication
        run: |
          echo 'Independent publication does not resolve expired SDK reconciliation health.' >&2
          exit 1
